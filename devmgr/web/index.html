<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OhEzTouch Device Manager</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>OhEzTouch <span class="dim">Device Manager</span></h1>
  <div class="header-controls">
    <input id="subnet" type="text" spellcheck="false" title="Subnet to scan, CIDR">
    <button id="scan-btn" class="primary">Scan</button>
    <button id="refresh-btn" title="Refresh all devices now">&#10227;</button>
    <button id="settings-btn" title="Settings">&#9881;</button>
    <button id="console-btn" title="Debug console">Console <span id="console-badge" class="badge hidden"></span></button>
  </div>
</header>

<div id="scan-progress" class="hidden"><div id="scan-bar"></div><span id="scan-text"></span></div>

<div id="settings-panel" class="panel hidden">
  <h2>Settings</h2>
  <label>Subnet to scan<br><input id="set-subnet" type="text" spellcheck="false"></label>
  <label>Refresh interval<br>
    <select id="set-interval">
      <option value="5">5 s</option>
      <option value="10">10 s</option>
      <option value="30">30 s</option>
      <option value="60">60 s</option>
    </select>
  </label>
  <label class="row"><input id="set-refresh-enabled" type="checkbox"> Refresh devices regularly</label>
  <label>Log level<br>
    <select id="set-log-level">
      <option value="debug">debug</option>
      <option value="info">info</option>
      <option value="warn">warn</option>
      <option value="error">error</option>
    </select>
  </label>
  <button id="settings-save" class="primary">Save</button>
</div>

<div id="bulk-bar" class="hidden">
  <span id="bulk-count"></span>
  <button id="bulk-config-btn">Bulk edit</button>
  <button id="bulk-update-btn">Firmware update</button>
  <button id="bulk-restart-btn">Restart</button>
  <button id="bulk-clear-btn" class="subtle">Clear selection</button>
</div>

<table id="devices">
  <thead>
    <tr>
      <th><input id="select-all" type="checkbox" title="Select all"></th>
      <th>Status</th><th>Hostname</th><th>IP</th><th>MAC</th><th>Target</th>
      <th>Version</th><th>RSSI</th><th>Uptime</th><th>Last seen</th><th>Actions</th>
    </tr>
  </thead>
  <tbody id="device-rows"></tbody>
</table>
<p id="empty-hint" class="dim hidden">No devices yet. Set a subnet and press Scan.</p>

<!-- config modal (single device and bulk share the renderer) -->
<div id="config-modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="config-title">Configure</h2>
    <div id="config-body" class="config-body"></div>
    <div id="config-result" class="result"></div>
    <div class="modal-actions">
      <button id="config-save" class="primary">Save</button>
      <button id="config-cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- firmware update modal -->
<div id="update-modal" class="modal hidden">
  <div class="modal-box">
    <h2>Firmware update</h2>
    <div id="update-devices"></div>
    <div class="update-source">
      <label class="row"><input type="radio" name="update-src" value="auto" checked> Automatic image per target</label>
      <div id="update-images" class="dim small"></div>
      <label class="row"><input type="radio" name="update-src" value="upload"> Upload image:
        <input type="file" id="update-file" accept=".bin">
      </label>
    </div>
    <div id="update-progress"></div>
    <div class="modal-actions">
      <button id="update-start" class="primary">Start update</button>
      <button id="update-close">Close</button>
    </div>
  </div>
</div>

<div id="console" class="hidden">
  <div id="console-toolbar">
    <strong>Console</strong>
    <select id="console-level">
      <option value="debug">All</option>
      <option value="info" selected>Info+</option>
      <option value="warn">Warn+</option>
      <option value="error">Errors</option>
    </select>
    <select id="console-source"><option value="">All sources</option></select>
    <button id="console-pause">Pause</button>
    <button id="console-copy">Copy</button>
    <button id="console-clear">Clear</button>
    <span class="spacer"></span>
    <button id="console-hide" class="subtle">&times;</button>
  </div>
  <div id="console-lines"></div>
</div>

<div id="toast" class="hidden"></div>

<script src="/app.js"></script>
</body>
</html>
