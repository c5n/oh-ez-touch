[env:Lanbon]
platform = espressif32
platform_packages = platformio/framework-arduinoespressif32
board = esp32dev
board_build.partitions = min_spiffs.csv
lib_deps =
    ${common.lib_deps}
    Adafruit BME280 Library
    AutoConnect @ 1.4.2
    yiannisbourkelis/Uptime Library @ ^1.0.0
    bodmer/TFT_eSPI
    lewisxhe/SensorLib @ ^0.4.1

build_flags =
	${common.build_flags}
	-DTARGET_NAME=\"Lanbon\"
	-DST7789_2_DRIVER=1
	-DTFT_MISO=25
	-DTFT_MOSI=23
	-DTFT_SCLK=19
	-DTFT_CS=22
	-DTFT_DC=21
	-DTFT_RST=18
	-DSPI_FREQUENCY=80000000
	-DSPI_READ_FREQUENCY=60000000
    -DTFT_BACKLIGHT_PIN=5
	-DTFT_BACKLIGHT_INVERT=1
	-DCONFIG_TFT_INVERSION_OFF=1
    -DTFT_RGB_ORDER=TFT_RGB
	-DDEBUG=0
	-DDEBUG_DISPLAY_TOUCH=1
;	-DTFT_BCKL=5
    -DTOUCH_DRIVER_FT6X36=1 ;5206
    -DTOUCH_FT6X36_SDA=4
    -DTOUCH_FT6X36_SCL=0
    -DTOUCH_FT6X36_FREQUENCY=400000
    -DLED_RED=26
    -DLED_GREEN=32
    -DLED_BLUE=33
    -DRELAY_1=12
    -DRELAY_2=24
    -DRELAY_3=37
upload_port = /dev/ttyUSB0
upload_speed = 921600
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

[env:linux]
; Host-side SDL2 simulator. Build and run with:
;   pio run -e linux -t exec
; Requires the SDL2 development files (Debian/Ubuntu: libsdl2-dev).
platform = native
; The `native` platform provides no framework; hal/sdl2 supplies the small
; Arduino compatibility layer (String/Serial/millis/delay and main()) instead.
framework =
extra_scripts = support/sdl2_build_extra.py
build_type = debug
debug_build_flags = -g
build_src_filter =
	+<*>
	+<../hal/sdl2/*.cpp>
	-<ac_main.cpp>
	-<wlan.cpp>
	-<openhab_sensor_*>
	-<ota/*>
	-<driver/*>

build_unflags = -w

; Same LVGL release as the embedded targets, so that the simulator renders
; what the device renders.
lib_deps =
	${common.lib_deps}

build_flags =
	${common.build_flags}
	-std=gnu++20
	-g
	; -Wpedantic was dropped: it only floods the log from the vendored
	; lodepng/lvgl/font C sources, which are built with these flags too.
	-Wall
	-DSIMULATOR=1
	-DTARGET_NAME=\"Simulator\"
	; Add recursive dirs for hal headers search
	!python3 -c "import os; print(' '.join(['-I {}'.format(i[0].replace('\x5C','/')) for i in os.walk('hal/sdl2')]))"
	; The display and mouse come from LVGL's own SDL driver (src/drivers/sdl),
	; which lv_conf.h enables off the -DSIMULATOR above. The window zoom that
	; -D SDL_ZOOM=2 used to set is now lv_sdl_window_set_zoom() in main.cpp.
