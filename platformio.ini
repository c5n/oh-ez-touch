; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
include_dir = src
default_envs = ArduiTouch_debug_JTAG, ArduiTouch

[common]
lib_deps =
	; upstream LVGL
	lvgl/lvgl@9.5.0
	bblanchon/ArduinoJson @ 7.4.3
    ;	Adafruit BME280 Library
    ;	AutoConnect @ 1.4.2
    ;	yiannisbourkelis/Uptime Library @ ^1.0.0
    ;	bodmer/TFT_eSPI

build_flags =
	-O0
	!echo '-DVERSION_GIT_HASH=\"'$(git log |head -1 |cut -c8-)'\"'
	-DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
	-DUSER_SETUP_LOADED=1
	-DLV_CONF_INCLUDE_SIMPLE=1
	-DAUTOCONNECT_STARTUPTIME=10
	-DAUTOCONNECT_PSK='""'
	-DLODEPNG_NO_COMPILE_ANCILLARY_CHUNKS=1
	-DLODEPNG_NO_COMPILE_DISK=1
	-DLODEPNG_NO_COMPILE_ENCODER=1
	-DLODEPNG_NO_COMPILE_ALLOCATORS=1
	-DAC_DEBUG=0
	-I ./src/

[env]
framework = arduino
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

[env:ArduiTouch_debug_JTAG]
platform = espressif32
platform_packages = platformio/framework-arduinoespressif32
board = esp32dev
board_build.partitions = min_spiffs.csv
build_type = debug
lib_deps =
	${common.lib_deps}
	Adafruit BME280 Library
    AutoConnect @ 1.4.2
    yiannisbourkelis/Uptime Library @ ^1.0.0
    bodmer/TFT_eSPI
build_flags =
	${common.build_flags}
	-DTARGET_NAME=\"ArduiTouchJTAG\"
	-DILI9341_DRIVER=1
	-DTFT_MISO=19
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=4
	-DTFT_RST=22
	-DTFT_RD=2
	-DTFT_WR=4
	-DTFT_TOUCH_FLIP=1
	-DTFT_BACKLIGHT_PIN=16
	-DTOUCH_CS=26
	-DSPI_FREQUENCY=40000000
	-DBEEPER_PIN=21
	-DDEBUG_LODEPNG_MALLOC=0
	-DDEBUG_AC_MAIN=0
	-DDEBUG_AC_SETTINGS=0
	-DDEBUG_BACKLIGHT_CONTROL=0
	-DDEBUG_BEEPER_CONTROL=0
	-DDEBUG_CONFIG=0
	-DDEBUG_WLAN_STATES=0
	-DDEBUG_WLAN=0
	-DDEBUG_DISPLAY_TOUCH=0
	-DDEBUG_OPENHAB_CONNECTOR=0
	-DDEBUG_OPENHAB_CONNECTOR_PACKETDUMP=0
	-DDEBUG_OPENHAB_SENSOR_BME280=0
	-DDEBUG_OPENHAB_SENSOR_CONNECTOR=0
	-DDEBUG_OPENHAB_UI=0
	-DDEBUG_UI_INFOLABEL=0
	-DDEBUG_UI_STYLE=0
	-DDEBUG_UI_SECURITY_PIN=0

upload_port = /dev/ttyUSB0
upload_speed = 921600
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
debug_tool = esp-prog

[env:ArduiTouch]
platform = espressif32
platform_packages = platformio/framework-arduinoespressif32
board = esp32dev
board_build.partitions = min_spiffs.csv
lib_deps =
	${common.lib_deps}
	Adafruit BME280 Library
    AutoConnect @ 1.4.2
    yiannisbourkelis/Uptime Library @ ^1.0.0
    bodmer/TFT_eSPI

build_flags =
	${common.build_flags}
	-DTARGET_NAME=\"ArduiTouch\"
	-DILI9341_DRIVER=1
	-DTFT_MISO=19
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=4
	-DTFT_RST=22
	-DTFT_TOUCH_FLIP=1
	-DTOUCH_CS=14
	-DSPI_FREQUENCY=40000000
	-DBEEPER_PIN=21

upload_port = /dev/ttyUSB0
upload_speed = 921600
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

